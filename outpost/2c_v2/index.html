html,body{margin:0;height:100%;background:#000;color:#fff;font-family:'Inter Tight','Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.gate{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center}
.brand{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.brand span{color:rgba(255,255,255,.55);font-weight:400;margin:0 12px}
form{margin-top:36px;display:flex;gap:0;width:min(360px,100%)}
input{flex:1;min-width:0;background:none;border:1px solid rgba(255,255,255,.3);border-right:0;color:#fff;font:inherit;font-size:15px;padding:12px 14px;outline:none;border-radius:0;-webkit-appearance:none}
input:focus{border-color:#fff}
button{background:#fff;color:#000;border:1px solid #fff;font:inherit;font-size:13px;letter-spacing:.08em;padding:0 18px;cursor:pointer;border-radius:0}
button:disabled{opacity:.5;cursor:default}
.msg{margin-top:16px;font-size:12px;color:rgba(255,255,255,.55);min-height:1.4em}
.msg.err{color:#fff}
</style>

  const KEY='outpost2cv2.key';
  const msg=document.getElementById('msg'),form=document.getElementById('f'),pw=document.getElementById('pw'),go=document.getElementById('go');
  function b64(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
  function b64e(u){let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
  async function deriveRaw(password){
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:SALT,iterations:ITER,hash:'SHA-256'},base,256));}
  async function importRaw(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);}
  async function open(key,buf){const u=new Uint8Array(buf);return crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},key,u.slice(12));}
  async function unlock(key,raw){
    let html;
    try{html=new TextDecoder().decode(await open(key,b64(DECK)));}
    catch(e){throw new Error('bad');}
    try{sessionStorage.setItem(KEY,b64e(raw));}catch(e){}
    document.open();document.write(html);document.close();
  }
  try{const saved=sessionStorage.getItem(KEY);if(saved){const raw=b64(saved);await unlock(await importRaw(raw),raw);return;}}catch(e){}
  form.addEventListener('submit',async e=>{
    e.preventDefault();const p=pw.value;if(!p)return;
    go.disabled=true;msg.className='msg';msg.textContent='Checking…';
    try{const raw=await deriveRaw(p);await unlock(await importRaw(raw),raw);}
    catch(err){msg.className='msg err';msg.textContent=err.message==='bad'?'Wrong password.':'Could not open the page.';go.disabled=false;pw.select();}
